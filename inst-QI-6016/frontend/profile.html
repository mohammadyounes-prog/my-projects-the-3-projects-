<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestAI Profile</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="i18n.js"></script>
    <link href="rtl.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Force override for all form labels */
        .form-label, 
        label {
            color: var(--nebula-accent-cyan) !important;
        }

        :root {
            --accent-blue-glow: rgba(0, 229, 255, 0.2);
        }

        body {
            background-color: var(--nebula-bg-deep);
            color: var(--nebula-text);
            font-family: var(--nebula-font-body);
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--nebula-bg-glass) !important;
            border: 1px solid var(--nebula-border) !important;
            border-radius: 1.25rem !important;
            color: var(--nebula-text) !important;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04) !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08) !important;
        }

        .profile-header {
            background: linear-gradient(135deg, var(--nebula-accent-cyan), #1e3a8a);
            color: white;
            padding: 60px 0;
            margin-bottom: 30px;
            border-radius: 0 0 2rem 2rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(44, 82, 130, 0.2);
        }
        .profile-header h1 {
            font-family: var(--nebula-font-display);
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
        }

        .page-header-orange {
            background: linear-gradient(135deg, var(--nebula-accent-cyan), #1e3a8a) !important;
            color: white !important;
            padding: 1.25rem !important;
            border-radius: 1.25rem 1.25rem 0 0 !important;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }

        .form-control, .form-select {
            background-color: var(--nebula-bg-input) !important;
            border: 1px solid var(--nebula-border) !important;
            color: var(--nebula-text) !important;
            border-radius: 0.75rem !important;
            padding: 0.6rem 1rem !important;
            transition: all 0.2s ease;
        }
        .form-control::placeholder {
            color: var(--nebula-text-dim) !important;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--nebula-bg-input) !important;
            border-color: var(--nebula-accent-cyan) !important;
            box-shadow: 0 0 0 4px var(--accent-blue-glow) !important;
            outline: none;
        }

        /* Button Overhaul */
        .btn {
            border-radius: 0.75rem !important;
            padding: 0.6rem 1.2rem !important;
            font-weight: 600 !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            border: none !important;
        }

        .nebula-btn--primary {
            background: linear-gradient(135deg, var(--nebula-accent-cyan), #1e3a8a) !important;
            color: white !important;
            box-shadow: 0 4px 15px rgba(44, 82, 130, 0.3) !important;
        }
        .nebula-btn--primary:hover {
            box-shadow: 0 6px 20px rgba(44, 82, 130, 0.5) !important;
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <script src="shell.js"></script>
    <script>
        if (!localStorage.getItem('access_token')) {
            window.location.href = 'login.html';
        }
    </script>

    <main>
        <div class="profile-header page-header-orange">
            <div class="container">
                <h1>User Profile</h1>
            </div>
        </div>
        <div class="container">
            <div class="row">
                <div class="col-lg-6 offset-lg-3">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title" data-i18n="profile.header">User Information</h5>
                    </div>
                    <div class="card-body">
                        <p><strong data-i18n="profile.username">Username:</strong> <span id="usernameDisplay"></span></p>
                        <p><strong data-i18n="profile.userId">User ID:</strong> <span id="userIdDisplay"></span></p>
                        <div id="adminUserControls" style="display:none;" class="mt-3">
                            <label for="userSelect" class="form-label">Select user (admin)</label>
                            <select id="userSelect" class="form-select"></select>
                            <small class="text-muted">As admin, choose a user to change their password.</small>
                        </div>
                    </div>
                </div>

                <div class="card mt-4 shadow-sm rounded-3">
                    <div class="card-header">
                        <h5 class="card-title" data-i18n="profile.changePassword.title">Change Password</h5>
                    </div>
                    <div class="card-body">
                        <form id="changePasswordForm">
                            <div class="mb-3">
                                <label for="currentPassword" class="form-label" data-i18n="profile.changePassword.current">Current Password</label>
                                <input type="password" class="form-control" id="currentPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="newPassword" class="form-label" data-i18n="profile.changePassword.new">New Password</label>
                                <input type="password" class="form-control" id="newPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmNewPassword" class="form-label" data-i18n="profile.changePassword.confirm">Confirm New Password</label>
                                <input type="password" class="form-control" id="confirmNewPassword" required>
                            </div>
                            <button type="submit" class="btn nebula-btn--primary" data-i18n="profile.changePassword.button">Change Password</button>
                        </form>
                        <div id="password-message" class="mt-3"></div>
                    </div>
                </div>


            </div>
        </div>
    </div>

        <script>

            document.addEventListener('DOMContentLoaded', async function() { // Changed to async

                const backendBaseUrl = (typeof window !== 'undefined' && window.BACKEND_BASE_URL) ? window.BACKEND_BASE_URL : 'http://127.0.0.1:8000';

                const usernameDisplay = document.getElementById('usernameDisplay');
                const userIdDisplay = document.getElementById('userIdDisplay');
                const changePasswordForm = document.getElementById('changePasswordForm');
                const passwordMessageDiv = document.getElementById('password-message');
                const adminUserControls = document.getElementById('adminUserControls');
                const userSelect = document.getElementById('userSelect');

                // Fetch current user data
                try {
                    const token = localStorage.getItem('access_token');
                    if (token) {
                        const response = await fetchWithAuth(`${backendBaseUrl}/users/me`);
                        if (response.ok) {
                            currentUser = await response.json();
                            if (currentUser) {
                                usernameDisplay.textContent = currentUser.full_name || currentUser.username || '';
                                userIdDisplay.textContent = currentUser.id || '';
                            }
                        }
                    }
                } catch (e) {
                    console.error('Error fetching current user data:', e);
                }
            });

        </script>

    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 QuestAI. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
