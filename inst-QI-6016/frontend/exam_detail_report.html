<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="examDetailReport.pageTitle">Exam Report Details - QuestAI</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/suite-tokens.css">
    <link rel="stylesheet" href="css/nebula-components.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="i18n.js"></script>
    <link href="rtl.css" rel="stylesheet">
    <style>
        .app-name-style {
            color: #CC0000; /* Darker red */
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3); /* Subtle shadow */
        }
    </style>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 20px;
        }
        .card {
            margin-bottom: 20px;
            border-radius: 0.75rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
        }
        .page-header-orange {
            background-color: #ffc107;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center; /* Center the header text */
        }
        .rtl-text {
            direction: rtl;
            text-align: right;
        }
        .report-details p {
            margin-bottom: 0.5rem;
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(0, 0, 0, 0.05);
        }
        td.status-correct {
            background-color: #d4edda !important; /* Light green */
            color: #155724; /* Dark green text */
        }
        td.status-incorrect {
            background-color: #f8d7da !important; /* Light red */
            color: #721c24; /* Dark red text */
        }
    </style>
</head>
<body>
    <script src="shell.js"></script>
    <div class="nebula-neural-grid"></div>
    <script>
        if (!localStorage.getItem('access_token')) {
            window.location.href = 'login.html';
        }
    </script>
    
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header page-header-orange">
                        <h2 id="reportTitle" class="mb-0"></h2> <!-- Report title will be dynamic -->
                    </div>
                    <div class="card-body">
                        <div id="reportDetails" class="report-details mb-4">
                            <!-- Exam details (name, username, date) will be injected here -->
                        </div>
                        <div id="reportTableContainer" class="table-responsive">
                            <!-- Report table will be injected here -->
                            <p id="loadingMessage" class="text-center" data-i18n="examDetailReport.loadingReport">Loading exam report...</p>
                        </div>
                        <div class="d-flex justify-content-end mt-3">
                            <button class="btn btn-secondary" onclick="window.history.back()" data-i18n="examDetailReport.backToList">Back to Exam List</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="exam_detail_report.js"></script>
</body>
</html>
