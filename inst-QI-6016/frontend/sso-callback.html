<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestAI - SSO Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/suite-tokens.css">
    <link rel="stylesheet" href="css/nebula-components.css">
    <style>
        body {
            background-color: var(--nebula-bg-deep);
            color: var(--nebula-text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: var(--nebula-font-body), 'Plus Jakarta Sans', sans-serif;
        }
        .loader-container {
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
            color: var(--nebula-accent-cyan);
        }
        .loader-container p {
            color: var(--nebula-text-muted);
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3">Verifying your session, please wait...</p>
    </div>

    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script>
        async function processSSO() {
            const urlParams = new URLSearchParams(window.location.search);
            const ssoToken = urlParams.get('token');

            if (!ssoToken) {
                console.error("No SSO token found in URL.");
                window.location.href = 'login.html';
                return;
            }

            const baseUrl = window.BACKEND_BASE_URL || 'http://127.0.0.1:8000';
            
            try {
                console.log("Attempting SSO verification with token:", ssoToken);
                const response = await fetch(`${baseUrl}/verify-sso?sso_token=${encodeURIComponent(ssoToken)}`);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'SSO verification failed');
                }

                const data = await response.json();
                
                // Store the local JWT
                localStorage.setItem('access_token', data.access_token);
                
                console.log("SSO Verification successful. Redirecting to home...");
                window.location.href = 'home.html';
            } catch (error) {
                console.error("SSO Error:", error);
                alert("SSO Authentication failed: " + error.message);
                window.location.href = 'login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', processSSO);
    </script>
</body>
</html>
