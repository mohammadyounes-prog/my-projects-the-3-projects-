            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        /* Refined Navbar */
        .navbar {

        .container {

            margin-bottom: 40px;

        .card {

            border: 1px solid var(--border-light) !important;
            border-radius: 1.25rem !important;
            color: var(--text-primary) !important;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04) !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08) !important;
        }

        .page-header-orange {
            background: linear-gradient(135deg, var(--accent-blue), #1e3a8a) !important;
            color: white !important;
            padding: 1.25rem !important;
            border-radius: 1.25rem 1.25rem 0 0 !important;
        }
        .page-header-orange h2 {
            font-family: var(--font-display);
            font-weight: 700;
            margin: 0;
            font-size: 1.75rem;
            color: white !important;
        }

        .rtl-text {
            direction: rtl;
            text-align: right;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:nth-child(1) { animation-delay: 0.1s; }

        .form-control, .form-select {
            background-color: #ffffff !important;
            border: 1px solid var(--border-light) !important;
            color: var(--text-primary) !important;
            border-radius: 0.75rem !important;
            padding: 0.6rem 1rem !important;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff !important;
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 4px var(--accent-blue-glow) !important;
            outline: none;
        }

        /* Button Overhaul */
        .btn {
            border-radius: 0.75rem !important;
            padding: 0.6rem 1.2rem !important;
            font-weight: 600 !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            border: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), #1e3a8a) !important;
            color: white !important;
            box-shadow: 0 4px 15px rgba(44, 82, 130, 0.3) !important;
        }
        .btn-primary:hover {

        .btn-secondary {

        .task-item {

    <script>
        (function(){
            try {
                var parts = location.pathname.split('/');
                var page = (parts[parts.length-1] || 'home.html').toLowerCase(); // Default to home.html
                document.querySelectorAll('.navbar a.nav-link').forEach(function(a){
                    a.classList.remove('active'); // Remove active from all links first
                    var href = (a.getAttribute('href')||'').toLowerCase();
                    if (href && page === href) {
                        a.classList.add('active');
                    }
                });
            } catch(e) { /* noop */ }
        })();
    </script>

    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header page-header-orange">
                        <h2 data-i18n="tasks.header">Task History</h2>
                    </div>
                    <div class="card-body">
                        <div id="tasksDisplay">
                            <p data-i18n="tasks.loading">Loading tasks...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backendBaseUrl = (typeof window !== 'undefined' && window.BACKEND_BASE_URL) ? window.BACKEND_BASE_URL : 'http://127.0.0.1:8000';
            const tasksDisplay = document.getElementById('tasksDisplay');



            async function fetchTasks() {
                tasksDisplay.innerHTML = `<div class="d-flex justify-content-center"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>`;
                try {
                    const response = await fetchWithAuth(`${backendBaseUrl}/tasks`, {
                        method: 'GET'
                    });
                    console.log('fetchTasks: After fetch call, response status:', response.status);

                    if (!response.ok) {
                        console.log('fetchTasks: Response not OK, status:', response.status);
                        const errorData = await response.json();
                        if (response.status === 401) {
                            console.log('fetchTasks: Calling handleUnauthorized due to 401.');
                            handleUnauthorized(errorData.detail || 'Not authenticated');
                            return;
                        }
                        throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                    }

                    const tasks = await response.json();
                    console.log('fetchTasks: Successfully parsed tasks JSON.', tasks);
                    tasksDisplay.innerHTML = '';

                    if (tasks.length === 0) {
                        tasksDisplay.innerHTML = `<p data-i18n="tasks.noTasks">No generation tasks found.</p>`;
                        window.i18n.translateNode(tasksDisplay);
                    } else {
                        tasks.forEach(task => {
                            console.log(`DEBUG (frontend): Task ${task.task_id} - generated_question_ids:`, task.generated_question_ids);
                            const taskItem = document.createElement('div');
                            taskItem.className = 'card mb-2 task-item';
                            taskItem.dataset.taskId = task.task_id;
                            taskItem.innerHTML = `
                                <div class="card-body">
                                    <h5 class="card-title"><span data-i18n="tasks.card.taskId">Task ID:</span> ${task.task_id}</h5>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.requested">Requested Questions:</span> ${task.num_questions_requested} questions</p>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.generated">Generated Questions:</span> ${task.num_questions_generated} questions</p>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.uploadedFile">Uploaded File:</span> ${task.uploaded_file_name || 'No uploaded file'}</p>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.status">Status:</span> <span class="badge bg-info">${task.status}</span></p>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.questionIds">Generated Question IDs:</span> ${Array.isArray(task.generated_question_ids) && task.generated_question_ids.length > 0 ? task.generated_question_ids.join(', ') : 'N/A'}</p>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.timestamp">Timestamp:</span> ${new Date(task.timestamp).toLocaleString()}</p>
                                    <p class="card-text mb-0"><small class="text-muted"><span data-i18n="tasks.card.parameters">Parameters:</span> ${task.request_parameters}</small></p>
                                </div>
                            `;
                            tasksDisplay.appendChild(taskItem);
                            window.i18n.translateNode(taskItem);
                        });

                        document.querySelectorAll('.task-item').forEach(item => {
                            item.addEventListener('click', function() {
                                const taskId = this.dataset.taskId;
                                // Navigate to retrieve_questions.html and filter by task_id
                                window.location.href = `index.html?taskId=${taskId}`;
                            });
                        });
                    }

                } catch (error) {
                    console.error('Error fetching tasks', error);
                    tasksDisplay.innerHTML = `<div class="alert alert-danger" role="alert">Error: ${error.message}</div>`;
                }
            }

            fetchTasks();
        });

            

                            </script>
