<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestAI Task History</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/suite-tokens.css">
    <link rel="stylesheet" href="css/nebula-components.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="i18n.js"></script>
    <link href="rtl.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Force override for all form labels */
        .form-label, 
        label {
            color: var(--nebula-accent-cyan) !important;
        }

        :root {
            /* Palette - LMS Unified (Light Mode) */
            --bg-main: #f8fafc;
            --bg-panel: #ffffff;
            --accent-blue: var(--nebula-accent-cyan);
            --label-blue: #1e3a8a; /* Darker blue for labels */
            --accent-blue-glow: rgba(44, 82, 130, 0.2);
            --accent-emerald: #10b981;
            --text-primary: #1e293b;
            --text-secondary: #6B7280;
            --border-light: rgba(0, 0, 0, 0.08);
            --glass-blur: blur(12px);
            
            /* Typography */
            --font-display: 'Inter', 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Plus Jakarta Sans', 'Cairo', sans-serif;
        }

        body {
            background-color: var(--nebula-bg-deep);
            color: var(--nebula-text);
            font-family: var(--nebula-font-body);
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .app-name-style {
            font-family: var(--nebula-font-display);
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #ffffff, #bfdbfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Refined Navbar */
        .navbar {
            background: var(--nebula-bg-glass) !important; 
            
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .navbar .nav-link {
            color: var(--nebula-text-muted) !important;
            font-weight: 500;
            transition: all 0.2s ease;
            padding-left: 0.75rem !important;
            padding-right: 0.75rem !important;
            font-size: 0.9rem;
        }
        .navbar .nav-link:hover {
            color: #ffffff !important;
        }
        #currentUserName {
            color: #ffffff !important;
        }

        .container {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--nebula-bg-glass) !important;
            border: 1px solid var(--nebula-border) !important;
            border-radius: 1.25rem !important;
            color: var(--nebula-text) !important;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04) !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08) !important;
        }

        .page-header-orange {
            background: linear-gradient(135deg, var(--nebula-accent-cyan), #1e3a8a) !important;
            color: white !important;
            padding: 1.25rem !important;
            border-radius: 1.25rem 1.25rem 0 0 !important;
        }
        .page-header-orange h2 {
            font-family: var(--nebula-font-display);
            font-weight: 700;
            margin: 0;
            font-size: 1.75rem;
            color: white !important;
        }

        .rtl-text {
            direction: rtl;
            text-align: right;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:nth-child(1) { animation-delay: 0.1s; }

        .form-control, .form-select {
            background-color: var(--nebula-bg-input) !important;
            border: 1px solid var(--nebula-border) !important;
            color: var(--nebula-text) !important;
            border-radius: 0.75rem !important;
            padding: 0.6rem 1rem !important;
            transition: all 0.2s ease;
        }
        .form-control::placeholder {
            color: var(--nebula-text-dim) !important;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--nebula-bg-input) !important;
            border-color: var(--nebula-accent-cyan) !important;
            box-shadow: 0 0 0 4px var(--accent-blue-glow) !important;
            outline: none;
        }

        /* Button Overhaul */
        .btn {
            border-radius: 0.75rem !important;
            padding: 0.6rem 1.2rem !important;
            font-weight: 600 !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            border: none !important;
        }

        .nebula-btn--primary {
            background: linear-gradient(135deg, var(--nebula-accent-cyan), #1e3a8a) !important;
            color: white !important;
            box-shadow: 0 4px 15px rgba(44, 82, 130, 0.3) !important;
        }
        .nebula-btn--primary:hover {
            box-shadow: 0 6px 20px rgba(44, 82, 130, 0.5) !important;
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.05) !important;
            color: var(--nebula-text) !important;
            border: 1px solid var(--nebula-border) !important;
        }

        .task-item {
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--nebula-border) !important;
            background: var(--nebula-bg-glass) !important;
        }
        .task-item:hover {
            border-color: var(--nebula-accent-cyan) !important;
            background-color: var(--nebula-bg-raised) !important;
            transform: scale(1.01);
        }
    </style>
</head>
<body>
    <script src="shell.js"></script>
    <script>
        const accessTokenOnLoad = localStorage.getItem('access_token');
        if (!accessTokenOnLoad) {
            window.location.href = 'login.html';
        }
    </script>
    

    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header page-header-orange">
                        <h2 data-i18n="tasks.header">Task History</h2>
                    </div>
                    <div class="card-body">
                        <div id="tasksDisplay">
                            <p data-i18n="tasks.loading">Loading tasks...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const backendBaseUrl = (typeof window !== 'undefined' && window.BACKEND_BASE_URL) ? window.BACKEND_BASE_URL : 'http://127.0.0.1:8000';
            const tasksDisplay = document.getElementById('tasksDisplay');



            async function fetchTasks() {
                tasksDisplay.innerHTML = `<div class="d-flex justify-content-center"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>`;
                try {
                    const response = await fetchWithAuth(`${backendBaseUrl}/tasks`, {
                        method: 'GET'
                    });
                    console.log('fetchTasks: After fetch call, response status:', response.status);

                    if (!response.ok) {
                        console.log('fetchTasks: Response not OK, status:', response.status);
                        const errorData = await response.json();
                        if (response.status === 401) {
                            console.log('fetchTasks: Calling handleUnauthorized due to 401.');
                            handleUnauthorized(errorData.detail || 'Not authenticated');
                            return;
                        }
                        throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                    }

                    const tasks = await response.json();
                    console.log('fetchTasks: Successfully parsed tasks JSON.', tasks);
                    tasksDisplay.innerHTML = '';

                    if (tasks.length === 0) {
                        tasksDisplay.innerHTML = `<p data-i18n="tasks.noTasks">No generation tasks found.</p>`;
                        window.i18n.translateNode(tasksDisplay);
                    } else {
                        tasks.forEach(task => {
                            console.log(`DEBUG (frontend): Task ${task.task_id} - generated_question_ids:`, task.generated_question_ids);
                            const taskItem = document.createElement('div');
                            taskItem.className = 'card mb-2 task-item';
                            taskItem.dataset.taskId = task.task_id;
                            taskItem.innerHTML = `
                                <div class="card-body">
                                    <h5 class="card-title"><span data-i18n="tasks.card.taskId">Task ID:</span> ${task.task_id}</h5>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.requested">Requested Questions:</span> ${task.num_questions_requested} questions</p>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.generated">Generated Questions:</span> ${task.num_questions_generated} questions</p>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.uploadedFile">Uploaded File:</span> ${task.uploaded_file_name || 'No uploaded file'}</p>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.status">Status:</span> <span class="badge bg-info">${task.status}</span></p>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.questionIds">Generated Question IDs:</span> ${Array.isArray(task.generated_question_ids) && task.generated_question_ids.length > 0 ? task.generated_question_ids.join(', ') : 'N/A'}</p>
                                    <p class="card-text mb-1"><span data-i18n="tasks.card.timestamp">Timestamp:</span> ${new Date(task.timestamp).toLocaleString()}</p>
                                    <p class="card-text mb-0"><small class="text-muted"><span data-i18n="tasks.card.parameters">Parameters:</span> ${task.request_parameters}</small></p>
                                </div>
                            `;
                            tasksDisplay.appendChild(taskItem);
                            window.i18n.translateNode(taskItem);
                        });

                        document.querySelectorAll('.task-item').forEach(item => {
                            item.addEventListener('click', function() {
                                const taskId = this.dataset.taskId;
                                // Navigate to retrieve_questions.html and filter by task_id
                                window.location.href = `index.html?taskId=${taskId}`;
                            });
                        });
                    }

                } catch (error) {
                    console.error('Error fetching tasks', error);
                    tasksDisplay.innerHTML = `<div class="alert alert-danger" role="alert">Error: ${error.message}</div>`;
                }
            }

            fetchTasks();
        });

            

                            </script>

            

                        </body>

            

                        </html>
