<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestAI Register</title>
    <script src="config.js"></script>
    <script>
        // Define a dynamic getter for backendBaseUrl
        Object.defineProperty(window, 'backendBaseUrl', {
            get: function() {
                return window.BACKEND_BASE_URL || window.location.origin;
            }
        });
    </script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="i18n.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/suite-tokens.css">
    <link rel="stylesheet" href="css/nebula-components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: var(--nebula-bg-deep);
            color: var(--nebula-text);
            font-family: var(--nebula-font-body), sans-serif;
        }
        .register-container {
            max-width: 460px;
            margin: 64px auto;
            position: relative;
            z-index: 1;
        }
        .register-container .card {
            background: var(--nebula-bg-glass) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid var(--nebula-border-glow) !important;
            border-radius: 12px !important;
            color: var(--nebula-text) !important;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1) !important;
        }
        .register-container .card-header {
            background: transparent !important;
            border-bottom: 1px solid var(--nebula-border) !important;
            text-align: center;
            padding: 1.5rem 1.5rem 1rem;
        }
        .register-container .card-header h1 {
            font-family: var(--nebula-font-display);
            font-size: 1.75rem;
        }
        .register-container .form-label {
            color: var(--nebula-accent-cyan) !important;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .register-container .form-control,
        .register-container .form-select {
            background: var(--nebula-bg-surface) !important;
            border: 1px solid var(--nebula-border) !important;
            color: var(--nebula-text) !important;
            border-radius: 8px !important;
        }
        .register-container .form-control:focus,
        .register-container .form-select:focus {
            border-color: var(--nebula-accent-cyan) !important;
            box-shadow: var(--nebula-glow-cyan-sm) !important;
        }
    </style>
</head>
<body>
    <div class="nebula-neural-grid"></div>
    <div class="container register-container">
        <div class="card">
            <div class="card-header text-center">
                <h1 class="text-center nebula-brand-text">QuestAI</h1>
                <h2 data-i18n="register"></h2>
            </div>
            <div class="card-body">
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="full_name" name="full_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label" data-i18n="password"></label>
                        <small class="form-text text-muted">Password should be 6 characters at least.</small>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                    <div class="mb-3">
                        <label for="mobile_phone" class="form-label">Mobile Phone</label>
                        <input type="tel" class="form-control" id="mobile_phone" name="mobile_phone" placeholder="+1 555 123 4567">
                    </div>
                    <div class="mb-3">
                        <label for="audience_type" class="form-label">Audience Type</label>
                        <select class="form-select" id="audience_type" name="audience_type" required></select>
                    </div>

                    <div id="dynamic-fields-container">
                        <div id="school-fields" style="display: none;">
                            <div class="mb-3">
                                <label for="school_role" class="form-label">Role</label>
                                <select class="form-select" id="school_role" name="role">
                                    <option value="teacher">Teacher</option>
                                    <option value="student">Student</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="school_name" class="form-label">School Name</label>
                                <input type="text" class="form-control" id="school_name" name="institution">
                            </div>
                        </div>

                        <div id="university-fields" style="display: none;">
                            <div class="mb-3">
                                <label for="university_role" class="form-label">Role</label>
                                <select class="form-select" id="university_role" name="role">
                                    <option value="instructor">Instructor</option>
                                    <option value="student">Student</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="university_name" class="form-label">University Name</label>
                                <input type="text" class="form-control" id="university_name" name="institution">
                            </div>
                        </div>

                        <div id="company-fields" style="display: none;">
                            <div class="mb-3">
                                <label for="company_role" class="form-label">Role</label>
                                <select class="form-select" id="company_role" name="role">
                                    <option value="manager">Manager</option>
                                    <option value="employee">Employee</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="company_name" class="form-label">Company Name</label>
                                <input type="text" class="form-control" id="company_name" name="institution">
                            </div>
                            <div class="mb-3">
                                <label for="department" class="form-label">Department</label>
                                <input type="text" class="form-control" id="department" name="department">
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="countryInput" class="form-label">Country</label>
                        <input type="text" id="countryInput" class="form-select" list="countryList" placeholder="Select Country" autocomplete="off" required>
                        <datalist id="countryList"></datalist>
                        <input type="hidden" id="country" name="country">
                    </div>
                    <!-- Tenant is assigned implicitly; selector removed per requirements -->
                    <div class="d-grid">
                        <button type="submit" class="btn nebula-btn--primary" data-i18n="register">Register</button>
                    </div>
                </form>
                <div id="error-message" class="alert alert-danger mt-3" style="display: none;"></div>
                <div class="text-center mt-3">
                    <a href="login.html">Login here</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const audienceSelect = document.getElementById('audience_type');
            const countrySelect = document.getElementById('country');
            const schoolFields = document.getElementById('school-fields');
            const universityFields = document.getElementById('university-fields');
            const companyFields = document.getElementById('company-fields');

            audienceSelect.addEventListener('change', function() {
                schoolFields.style.display = 'none';
                universityFields.style.display = 'none';
                companyFields.style.display = 'none';

                // Clear required attributes
                document.querySelectorAll('#dynamic-fields-container [required]').forEach(el => el.required = false);

                const selectedAudience = this.value;
                if (selectedAudience === 'school') {
                    schoolFields.style.display = 'block';
                    document.querySelector('#school_name').required = true;
                } else if (selectedAudience === 'university') {
                    universityFields.style.display = 'block';
                    document.querySelector('#university_name').required = true;
                } else if (selectedAudience === 'company') {
                    companyFields.style.display = 'block';
                    document.querySelector('#company_name').required = true;
                    document.querySelector('#department').required = true;
                }
            });

            try {
                // Populate audience types (fixed list matching backend usage)
                audienceSelect.innerHTML = '<option value="">Select Audience Type</option>';
                [
                  { value: 'school', name: 'School' },
                  { value: 'university', name: 'University' },
                  { value: 'company', name: 'Company' }
                ].forEach(t => {
                  const opt = document.createElement('option');
                  opt.value = t.value;
                  opt.textContent = t.name;
                  audienceSelect.appendChild(opt);
                });

                // Load countries
                const countryList = document.getElementById('countryList');
                const hiddenCountryInput = document.getElementById('country');
                const textCountryInput = document.getElementById('countryInput');

                try {
                    const currentLang = localStorage.getItem('lang') || 'en';
                    const countryUrl = new URL(`${backendBaseUrl}/lookup/countries`);
                    countryUrl.searchParams.set('lang', currentLang);
                    
                    console.log(`DEBUG: Fetching countries from: ${countryUrl.toString()}`);
                    const rc = await fetch(countryUrl.toString());
                    if (rc.ok) {
                        const countries = await rc.json();
                        countryList.innerHTML = '';
                        countries.forEach(c => {
                            const option = document.createElement('option');
                            if (typeof c === 'string') {
                                option.value = c;
                            } else {
                                option.value = c.name || "";
                                // Store the actual value (ID or English name) in a data attribute
                                option.dataset.value = c.english_name || c.name || "";
                            }
                            countryList.appendChild(option);
                        });

                        textCountryInput.addEventListener('input', function() {
                            const val = this.value;
                            const opts = countryList.childNodes;
                            let found = false;
                            for (let i = 0; i < opts.length; i++) {
                                if (opts[i].value === val) {
                                    hiddenCountryInput.value = opts[i].dataset.value || opts[i].value;
                                    found = true;
                                    break;
                                }
                            }
                            if (!found) hiddenCountryInput.value = '';
                        });

                        console.log('DEBUG: Country datalist populated.');
                    } else {
                        console.error('Failed to fetch countries:', rc.status);
                    }
                } catch(e) {
                    console.error('Error loading countries:', e);
                }
            } catch (error) {
                console.error('Error in register initial setup:', error);
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const errorMessageDiv = document.getElementById('error-message');
            errorMessageDiv.style.display = 'none';

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const fullName = document.getElementById('full_name').value;
            const mobilePhone = document.getElementById('mobile_phone').value;
            const audienceType = document.getElementById('audience_type').value;
            const country = document.getElementById('country').value;

            if (password !== confirmPassword) {
                errorMessageDiv.textContent = 'Passwords do not match.';
                errorMessageDiv.style.display = 'block';
                return;
            }

            if (username.length < 6) {
                errorMessageDiv.textContent = 'Username must be at least 6 characters.';
                errorMessageDiv.style.display = 'block';
                return;
            }

            const requestBody = {
                username, email, password, full_name: fullName, 
                mobile_phone: mobilePhone || null, 
                audience_type: audienceType || null, 
                country: country || null
            };

            if (audienceType === 'school') {
                requestBody.role = document.getElementById('school_role').value;
                requestBody.institution = document.getElementById('school_name').value;
            } else if (audienceType === 'university') {
                requestBody.role = document.getElementById('university_role').value;
                requestBody.institution = document.getElementById('university_name').value;
            } else if (audienceType === 'company') {
                requestBody.role = document.getElementById('company_role').value;
                requestBody.institution = document.getElementById('company_name').value;
                requestBody.department = document.getElementById('department').value;
            }

            try {
                const response = await fetch(`${backendBaseUrl}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Registration failed');
                }

                alert('Registration successful! Please log in.');
                window.location.href = 'login.html';

            } catch (error) {
                alert(error.message || 'Registration failed');
                errorMessageDiv.textContent = error.message;
                errorMessageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
