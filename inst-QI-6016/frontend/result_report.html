<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="resultReport.pageTitle">Result Report - QuestAI</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script src="utils.js"></script>
    <script src="auth.js"></script>
    <script src="i18n.js"></script>
    <link href="rtl.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Force override for all form labels */
        .form-label, 
        label {
            color: #2c5282 !important;
        }

        :root {
            /* Palette - LMS Unified (Light Mode) */
            --bg-main: #f8fafc;
            --bg-panel: #ffffff;
            --accent-blue: #2c5282;
            --label-blue: #1e3a8a; /* Darker blue for labels */
            --accent-blue-glow: rgba(44, 82, 130, 0.2);
            --accent-emerald: #10b981;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-light: rgba(0, 0, 0, 0.08);
            --glass-blur: blur(12px);
            
            /* Typography */
            --font-display: 'Space Grotesk', 'IBM Plex Sans Arabic', sans-serif;
            --font-body: 'Plus Jakarta Sans', 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-body);
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .app-name-style {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #ffffff, #bfdbfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Refined Navbar */
        .navbar {
            background: var(--accent-blue) !important;
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            font-weight: 500;
            transition: all 0.2s ease;
            padding-left: 0.75rem !important;
            padding-right: 0.75rem !important;
            font-size: 0.9rem;
        }
        .navbar .nav-link:hover {
            color: #ffffff !important;
        }
        #currentUserName {
            color: #ffffff !important;
        }

        .container {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--bg-panel) !important;
            border: 1px solid var(--border-light) !important;
            border-radius: 1.25rem !important;
            color: var(--text-primary) !important;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04) !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08) !important;
        }

        .page-header-orange {
            background: linear-gradient(135deg, var(--accent-blue), #1e3a8a) !important;
            color: white !important;
            padding: 1.25rem !important;
            border-radius: 1.25rem 1.25rem 0 0 !important;
        }
        .page-header-orange h2 {
            font-family: var(--font-display);
            font-weight: 700;
            margin: 0;
            font-size: 1.75rem;
            color: white !important;
        }

        .rtl-text {
            direction: rtl;
            text-align: right;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:nth-child(1) { animation-delay: 0.1s; }

        .form-control, .form-select {
            background-color: #ffffff !important;
            border: 1px solid var(--border-light) !important;
            color: var(--text-primary) !important;
            border-radius: 0.75rem !important;
            padding: 0.6rem 1rem !important;
            transition: all 0.2s ease;
        }

        .form-control:focus, .form-select:focus {
            background-color: #ffffff !important;
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 4px var(--accent-blue-glow) !important;
            outline: none;
        }

        /* Button Overhaul */
        .btn {
            border-radius: 0.75rem !important;
            padding: 0.6rem 1.2rem !important;
            font-weight: 600 !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            border: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), #1e3a8a) !important;
            color: white !important;
            box-shadow: 0 4px 15px rgba(44, 82, 130, 0.3) !important;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(44, 82, 130, 0.5) !important;
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>
    <script>
        if (!localStorage.getItem('access_token')) {
            window.location.href = 'login.html';
        }
    </script>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="home.html"><span class="app-name-style">QuestAI</span></a>
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="home.html" data-i18n="nav.home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="index.html" data-i18n="nav.generateQuestions">Generate Questions</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="tasks.html" data-i18n="nav.taskHistory">Task History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="profile.html" data-i18n="nav.profile">Profile</a>
                </li>
                <li class="nav-item" id="resultReportNavItem">
                    <a class="nav-link" href="result_report.html" data-i18n="nav.resultReport">Result Report</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="billing.html" data-i18n="nav.bundlesManagement">Bundles Management</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="user_preferences.html" data-i18n="nav.userPreferences">User Preferences</a>
                </li>
                <li class="nav-item" id="settingsNavItem">
                    <a class="nav-link" href="admin_dashboard.html" data-i18n="nav.settings">Settings</a>
                </li>
                <li class="nav-item" id="adminNavItem">
                    <a class="nav-link" href="admin.html" data-i18n="nav.admin">Admin</a>
                </li>
                <li class="nav-item" id="takeATestNavItem">
                    <a class="nav-link" href="tamsQB.html" data-i18n="nav.takeATest">Take a Test</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <select id="langSwitcher" class="form-select form-select-sm" style="width: 70px;">
                    <option value="en">EN</option>
                    <option value="ar">AR</option>
                </select>
                <span id="currentUserName" class="text-white"></span>
                <button class="btn btn-outline-light btn-sm" id="logoutButton">Logout</button>
            </div>

        </div>
    </nav>
    <script>
        (function(){
            try {
                var parts = location.pathname.split('/');
                var page = (parts[parts.length-1] || 'home.html').toLowerCase(); // Default to home.html
                document.querySelectorAll('.navbar a.nav-link').forEach(function(a){
                    a.classList.remove('active'); // Remove active from all links first
                    var href = (a.getAttribute('href')||'').toLowerCase();
                    if (href && page === href) {
                        a.classList.add('active');
                    }
                });
            } catch(e) { /* noop */ }
        })();
    </script>

    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header page-header-orange">
                        <h2 data-i18n="resultReport.title">Result Report</h2>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label for="startDate" class="form-label" data-i18n="resultReport.startDate">Start Date</label>
                                <input type="date" class="form-control" id="startDate">
                            </div>
                            <div class="col-md-3">
                                <label for="endDate" class="form-label" data-i18n="resultReport.endDate">End Date</label>
                                <input type="date" class="form-control" id="endDate">
                            </div>
                            <div class="col-md-2">
                                <label for="pageSize" class="form-label" data-i18n="resultReport.pageSize">Page Size</label>
                                <select id="pageSize" class="form-select">
                                    <option value="10">10</option>
                                    <option value="25">25</option>
                                    <option value="50">50</option>
                                </select>
                            </div>
                            <div class="col-md-2 align-self-end">
                                <button id="filterButton" class="btn btn-primary" data-i18n="resultReport.filter">Filter</button>
                            </div>
                        </div>
                        <div id="examsTable"></div>
                        <div id="paginationControls" class="d-flex justify-content-center mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Highlight the active nav link for this page
            const currentPage = 'result_report.html';
            document.querySelectorAll('.navbar a.nav-link').forEach(function(a){
                a.classList.remove('active');
                if (a.getAttribute('href').toLowerCase() === currentPage) {
                    a.classList.add('active');
                }
            });

            // Initialize i18n for this page
            // Assuming i18n.init() is called elsewhere or in the general framework setup
            document.addEventListener('i18n:applied', function() {
                // Any page-specific i18n updates can go here
                console.log('i18n applied to result_report.html');
            });
            
        });
    </script>
    <script src="result_report.js"></script>
</body>
</html>
