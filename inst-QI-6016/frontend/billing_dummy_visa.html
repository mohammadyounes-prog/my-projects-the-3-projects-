<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dummy Visa Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: sans-serif;
        }
        .payment-card {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .payment-card h1 {
            color: #007bff;
            margin-bottom: 20px;
        }
        .payment-card p {
            color: #6c757d;
            margin-bottom: 30px;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="payment-card">
        <h1>Simulating Visa Payment...</h1>
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p>Please wait while your payment is processed.</p>
        <p>You will be redirected shortly.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentIntentId = urlParams.get('payment_intent_id');
            const status = urlParams.get('status');
            const productId = urlParams.get('product_id');
            const tenantId = urlParams.get('tenant_id');
            const userId = urlParams.get('user_id');
            const questionsQuota = urlParams.get('questions_quota');
            const audienceType = urlParams.get('audience_type');
            const amountCents = urlParams.get('amount_cents');
            const currencyCode = urlParams.get('currency_code');

            // Simulate payment processing time
            setTimeout(async () => {
                // Simulate webhook call to update balance
                if (status === 'succeeded') {
                    try {
                        const webhookPayload = {
                            "id": "evt_dummy_webhook",
                            "type": "payment_intent.succeeded",
                            "data": {
                                "object": {
                                    "id": paymentIntentId,
                                    "amount_received": parseInt(amountCents),
                                    "currency": currencyCode,
                                    "metadata": {
                                        "product_id": parseInt(productId),
                                        "tenant_id": parseInt(tenantId),
                                        "user_id": parseInt(userId),
                                        "questions_quota": parseInt(questionsQuota),
                                        "audience_type": audienceType,
                                        "amount_cents": parseInt(amountCents),
                                        "currency_code": currencyCode
                                    },
                                    "status": "succeeded",
                                }
                            }
                        };
                        // Note: In a real scenario, the webhook would be sent by the payment gateway server-to-server.
                        // This is a client-side simulation for testing purposes.
                        await fetch('http://127.0.0.1:8000/billing/webhook', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(webhookPayload)
                        });
                        console.log('Dummy webhook sent successfully.');
                    } catch (error) {
                        console.error('Error sending dummy webhook:', error);
                    }
                }

                // Redirect back to billing.html with payment status
                window.location.href = `billing.html?payment_intent_id=${paymentIntentId}&status=${status}`;
            }, 3000); // Redirect after 3 seconds
        });
    </script>
</body>
</html>
