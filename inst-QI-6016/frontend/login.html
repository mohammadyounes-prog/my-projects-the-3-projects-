<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestAI Login</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/suite-tokens.css">
    <link rel="stylesheet" href="css/nebula-components.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script>
        // Define a dynamic getter for backendBaseUrl
        Object.defineProperty(window, 'backendBaseUrl', {
            get: function() {
                return window.BACKEND_BASE_URL || window.location.origin;
            }
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F7F8FA;
            color: #333;
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: row;
        }

        .split-left {
            flex: 1;
            background-color: #1B2A4A;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            text-align: center;
        }

        .split-left h1 {
            color: teal;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .split-left p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .split-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-color: #F7F8FA;
        }

        .login-container {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .login-container .card-header {
            background: transparent;
            border-bottom: 1px solid #eee;
            padding: 1.5rem 1.5rem 1rem;
            text-align: center;
        }

        .login-container .card-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
            color: #333;
        }

        .login-container .card-body {
            padding: 2rem 1.5rem;
        }

        .form-label {
            color: teal !important;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            background: #fff !important;
            border: 1px solid #ccc !important;
            color: #333 !important;
            border-radius: 8px !important;
            padding: 0.65rem 0.85rem !important;
            font-family: 'Inter', sans-serif;
        }

        .form-control:focus {
            border-color: teal !important;
            box-shadow: 0 0 0 0.25rem rgba(0, 128, 128, 0.25) !important;
            outline: none;
        }

        .btn-primary {
            background-color: teal;
            border-color: teal;
            color: white;
        }

        .btn-primary:hover {
            background-color: #006666;
            border-color: #006666;
            color: white;
        }

        .login-register-link {
            color: teal;
            font-weight: 600;
            text-decoration: none;
        }

        .login-register-link:hover {
            text-decoration: underline;
        }

        .alert-danger {
            background-color: rgba(220, 38, 38, 0.1);
            border-color: rgba(220, 38, 38, 0.5);
            color: #ff6b6b;
            border-radius: 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="split-left">
        <h1>QuestAI</h1>
        <p>Your ultimate platform for generating, managing, and retrieving high-quality questions.</p>
    </div>

    <main class="split-right">
        <div class="login-container">
            <div class="card-header">
                <h2>Sign in to continue</h2>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
                <div id="error-message" class="alert alert-danger mt-3" style="display: none;" role="alert"></div>
                <div class="text-center mt-3">
                    <a class="login-register-link" href="register.html">Register Now</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const errorMessageDiv = document.getElementById('error-message');
            errorMessageDiv.style.display = 'none';

            const formData = new FormData(this);
            // Diagnostics: log payload keys (not password value)
            try {
                const debugPayload = Object.fromEntries(formData);
                if (debugPayload && debugPayload.password) debugPayload.password = '***';
                console.log('Login submit payload (debug):', debugPayload);
            } catch (e) {
                console.warn('Could not log payload for debug:', e);
            }

            const searchParams = new URLSearchParams();
            for (const pair of formData) {
                searchParams.append(pair[0], pair[1]);
            }

            try {
                console.log('Posting to', `${backendBaseUrl}/token`);
                const response = await fetch(`${backendBaseUrl}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: searchParams.toString(),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Login failed');
                }
                console.log('Response OK, attempting to parse JSON...');
                const data = await response.json();
                console.log('DEBUG: Backend login response data:', data); // ADDED DEBUG LOG
                localStorage.setItem('access_token', data.access_token);
                console.log('DEBUG: access_token stored:', localStorage.getItem('access_token'));
                localStorage.setItem('username', formData.get('username')); // Store username
                localStorage.setItem('isAdmin', data.is_admin); // Store isAdmin flag
                console.log('is_super_admin from backend:', data.is_super_admin);
            localStorage.setItem('isSuperAdmin', data.is_super_admin === 1 ? 'true' : 'false'); // Store isSuperAdmin flag as boolean string
                localStorage.setItem('expiresIn', data.expires_in); // Store token expiration time

                // Clear the session flag for question generation on new login
                sessionStorage.removeItem('questionsGeneratedThisSession');

                console.log('Login successful, redirecting...');
                if (data.is_admin === 1 || data.is_super_admin === 1) {
                    window.location.href = 'home.html';
                } else {
                    window.location.href = 'home.html';
                }

            } catch (error) {
                errorMessageDiv.textContent = error.message;
                errorMessageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
