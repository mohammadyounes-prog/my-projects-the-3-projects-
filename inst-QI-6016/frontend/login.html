<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestAI Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/suite-tokens.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script>
        // Define a dynamic getter for backendBaseUrl
        Object.defineProperty(window, 'backendBaseUrl', {
            get: function() {
                return window.BACKEND_BASE_URL || window.location.origin;
            }
        });
    </script>
    <style>
        .app-name-style {
            color: #CC0000; /* Darker red */
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3); /* Subtle shadow */
        }
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="card">
            <div class="card-header text-center">
                <h1 class="text-center app-name-style">QuestAI</h1>
                <h2>Login</h2>
            </div>
            <div class="card-body">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
                <div id="error-message" class="alert alert-danger mt-3" style="display: none;"></div>
                <div class="text-center mt-3">
                    <a href="register.html">Register Now</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const errorMessageDiv = document.getElementById('error-message');
            errorMessageDiv.style.display = 'none';

            const formData = new FormData(this);
            // Diagnostics: log payload keys (not password value)
            try {
                const debugPayload = Object.fromEntries(formData);
                if (debugPayload && debugPayload.password) debugPayload.password = '***';
                console.log('Login submit payload (debug):', debugPayload);
            } catch (e) {
                console.warn('Could not log payload for debug:', e);
            }

            const searchParams = new URLSearchParams();
            for (const pair of formData) {
                searchParams.append(pair[0], pair[1]);
            }

            try {
                console.log('Posting to', `${backendBaseUrl}/token`);
                const response = await fetch(`${backendBaseUrl}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: searchParams.toString(),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Login failed');
                }
                console.log('Response OK, attempting to parse JSON...');
                const data = await response.json();
                console.log('DEBUG: Backend login response data:', data); // ADDED DEBUG LOG
                localStorage.setItem('access_token', data.access_token);
                console.log('DEBUG: access_token stored:', localStorage.getItem('access_token'));
                localStorage.setItem('username', formData.get('username')); // Store username
                localStorage.setItem('isAdmin', data.is_admin); // Store isAdmin flag
                console.log('is_super_admin from backend:', data.is_super_admin);
            localStorage.setItem('isSuperAdmin', data.is_super_admin === 1 ? 'true' : 'false'); // Store isSuperAdmin flag as boolean string
                localStorage.setItem('expiresIn', data.expires_in); // Store token expiration time

                // Clear the session flag for question generation on new login
                sessionStorage.removeItem('questionsGeneratedThisSession');

                console.log('Login successful, redirecting...');
                if (data.is_admin === 1 || data.is_super_admin === 1) {
                    window.location.href = 'home.html';
                } else {
                    window.location.href = 'home.html';
                }

            } catch (error) {
                errorMessageDiv.textContent = error.message;
                errorMessageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
