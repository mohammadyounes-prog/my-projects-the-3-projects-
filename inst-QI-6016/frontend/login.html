<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestAI Login</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/suite-tokens.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script>
        // Define a dynamic getter for backendBaseUrl
        Object.defineProperty(window, 'backendBaseUrl', {
            get: function() {
                return window.BACKEND_BASE_URL || window.location.origin;
            }
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Palette/fonts from css/suite-tokens.css (synced from design-system/tokens.css).
           Keep only page-local vars not provided by the suite file. */
        :root {
            --glass-blur: blur(12px);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-body);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-name-style {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #ffffff, #bfdbfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Suite header — matches home.html navbar treatment */
        .navbar {
            background: var(--accent-blue) !important;
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            min-height: var(--suite-header-height);
        }
        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .navbar .nav-link:hover {
            color: #ffffff !important;
        }

        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--suite-space-5) var(--suite-space-3);
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, var(--suite-primary-soft), transparent),
                var(--bg-main);
        }

        .login-container {
            max-width: 420px;
            width: 100%;
        }

        .login-card {
            background: var(--bg-panel) !important;
            border: 1px solid var(--border-light) !important;
            border-radius: var(--suite-radius-lg) !important;
            color: var(--text-primary) !important;
            box-shadow: var(--suite-shadow-2) !important;
            overflow: hidden;
        }

        .login-card .card-header {
            background: linear-gradient(135deg, var(--accent-blue), var(--suite-primary-dark)) !important;
            color: var(--suite-on-primary) !important;
            border-bottom: none !important;
            padding: var(--suite-space-4) var(--suite-space-4) var(--suite-space-3);
            text-align: center;
        }

        .login-card .card-header h1 {
            font-family: var(--font-display);
            font-size: var(--suite-text-h2);
            font-weight: 700;
            letter-spacing: var(--suite-tracking-display);
            margin: 0 0 var(--suite-space-2);
            color: var(--suite-on-primary);
            -webkit-text-fill-color: var(--suite-on-primary);
            background: none;
        }

        .login-card .card-header h2 {
            font-family: var(--font-body);
            font-size: var(--suite-text-body);
            font-weight: 500;
            margin: 0;
            color: rgba(255, 255, 255, 0.9);
        }

        .login-card .card-body {
            padding: var(--suite-space-4);
        }

        .form-label {
            color: var(--accent-blue) !important;
            font-weight: 600;
            font-size: var(--suite-text-caption);
        }

        .form-control {
            border-radius: var(--suite-radius-sm) !important;
            border-color: var(--border-light) !important;
            padding: 0.65rem 0.85rem !important;
            font-family: var(--font-body);
        }

        .form-control:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 0.2rem rgba(44, 82, 130, 0.2) !important;
        }

        .btn {
            border-radius: var(--suite-radius-md) !important;
            padding: 0.6rem 1.2rem !important;
            font-weight: 600 !important;
            font-family: var(--font-body);
            transition: all var(--suite-duration-med) var(--suite-ease) !important;
            border: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--suite-primary-dark)) !important;
            color: var(--suite-on-primary) !important;
            box-shadow: 0 4px 15px rgba(44, 82, 130, 0.3) !important;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(44, 82, 130, 0.5) !important;
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .login-register-link {
            color: var(--accent-blue);
            font-weight: 600;
            text-decoration: none;
        }

        .login-register-link:hover {
            color: var(--suite-primary-dark);
            text-decoration: underline;
        }

        .alert-danger {
            background-color: #fef2f2;
            border-color: rgba(220, 38, 38, 0.25);
            color: var(--suite-danger);
            border-radius: var(--suite-radius-sm);
            font-size: var(--suite-text-caption);
        }

        .footer {
            background-color: var(--text-primary);
            color: white;
            padding: var(--suite-space-4) 0;
            text-align: center;
            margin-top: auto;
            font-size: var(--suite-text-caption);
        }
    </style>
</head>
<body class="suite-root">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top suite-motion-header">
        <div class="container-fluid">
            <a class="navbar-brand" href="login.html"><span class="app-name-style">QuestAI</span></a>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <a class="nav-link" href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <main class="login-main suite-motion-page">
        <div class="login-container">
            <div class="card login-card suite-motion-card">
                <div class="card-header">
                    <h1>QuestAI</h1>
                    <h2>Sign in to continue</h2>
                </div>
                <div class="card-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Login</button>
                        </div>
                    </form>
                    <div id="error-message" class="alert alert-danger mt-3" style="display: none;" role="alert"></div>
                    <div class="text-center mt-3">
                        <a class="login-register-link" href="register.html">Register Now</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2025 QuestAI. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const errorMessageDiv = document.getElementById('error-message');
            errorMessageDiv.style.display = 'none';

            const formData = new FormData(this);
            // Diagnostics: log payload keys (not password value)
            try {
                const debugPayload = Object.fromEntries(formData);
                if (debugPayload && debugPayload.password) debugPayload.password = '***';
                console.log('Login submit payload (debug):', debugPayload);
            } catch (e) {
                console.warn('Could not log payload for debug:', e);
            }

            const searchParams = new URLSearchParams();
            for (const pair of formData) {
                searchParams.append(pair[0], pair[1]);
            }

            try {
                console.log('Posting to', `${backendBaseUrl}/token`);
                const response = await fetch(`${backendBaseUrl}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: searchParams.toString(),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Login failed');
                }
                console.log('Response OK, attempting to parse JSON...');
                const data = await response.json();
                console.log('DEBUG: Backend login response data:', data); // ADDED DEBUG LOG
                localStorage.setItem('access_token', data.access_token);
                console.log('DEBUG: access_token stored:', localStorage.getItem('access_token'));
                localStorage.setItem('username', formData.get('username')); // Store username
                localStorage.setItem('isAdmin', data.is_admin); // Store isAdmin flag
                console.log('is_super_admin from backend:', data.is_super_admin);
            localStorage.setItem('isSuperAdmin', data.is_super_admin === 1 ? 'true' : 'false'); // Store isSuperAdmin flag as boolean string
                localStorage.setItem('expiresIn', data.expires_in); // Store token expiration time

                // Clear the session flag for question generation on new login
                sessionStorage.removeItem('questionsGeneratedThisSession');

                console.log('Login successful, redirecting...');
                if (data.is_admin === 1 || data.is_super_admin === 1) {
                    window.location.href = 'home.html';
                } else {
                    window.location.href = 'home.html';
                }

            } catch (error) {
                errorMessageDiv.textContent = error.message;
                errorMessageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
