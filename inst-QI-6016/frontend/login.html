<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestAI Login</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/suite-tokens.css">
    <link rel="stylesheet" href="css/nebula-components.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script>
        // Define a dynamic getter for backendBaseUrl
        Object.defineProperty(window, 'backendBaseUrl', {
            get: function() {
                return window.BACKEND_BASE_URL || window.location.origin;
            }
        });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* Nebula Theme overrides */
        body {
            background-color: var(--nebula-bg-deep);
            color: var(--nebula-text);
            font-family: var(--nebula-font-body), sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar glassmorphism */
        .navbar {
            background: var(--nebula-bg-glass) !important;
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--nebula-border);
            padding: 0.5rem 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            min-height: 60px;
        }
        .navbar .nav-link {
            color: var(--nebula-text-muted) !important;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .navbar .nav-link:hover {
            color: var(--nebula-text) !important;
        }

        .login-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            z-index: 1;
        }

        .login-container {
            max-width: 420px;
            width: 100%;
        }

        .login-card {
            background: var(--nebula-bg-glass) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid var(--nebula-border-glow) !important;
            border-radius: 12px !important;
            color: var(--nebula-text) !important;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1) !important;
            overflow: hidden;
        }

        .login-card .card-header {
            background: transparent !important;
            color: var(--nebula-text) !important;
            border-bottom: 1px solid var(--nebula-border) !important;
            padding: 1.5rem 1.5rem 1rem;
            text-align: center;
        }

        .login-card .card-header h1 {
            font-family: var(--nebula-font-display);
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 0.5rem;
            color: var(--nebula-accent-cyan);
            -webkit-text-fill-color: var(--nebula-accent-cyan);
            text-shadow: var(--nebula-glow-cyan-sm);
        }

        .login-card .card-header h2 {
            font-family: var(--nebula-font-body);
            font-size: 1rem;
            font-weight: 500;
            margin: 0;
            color: var(--nebula-text-muted);
        }

        .login-card .card-body {
            padding: 1.5rem;
        }

        .form-label {
            color: var(--nebula-accent-cyan) !important;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            background: var(--nebula-bg-surface) !important;
            border: 1px solid var(--nebula-border) !important;
            color: var(--nebula-text) !important;
            border-radius: 8px !important;
            padding: 0.65rem 0.85rem !important;
            font-family: var(--nebula-font-body);
        }

        .form-control:focus {
            border-color: var(--nebula-accent-cyan) !important;
            box-shadow: var(--nebula-glow-cyan-sm) !important;
            outline: none;
        }

        .login-register-link {
            color: var(--nebula-accent-cyan);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .login-register-link:hover {
            color: var(--nebula-text);
            text-shadow: var(--nebula-glow-cyan-sm);
        }

        .alert-danger {
            background-color: rgba(220, 38, 38, 0.1);
            border-color: rgba(220, 38, 38, 0.5);
            color: #ff6b6b;
            border-radius: 8px;
            font-size: 0.85rem;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.2);
        }

        .footer {
            background-color: var(--nebula-bg-surface);
            border-top: 1px solid var(--nebula-border);
            color: var(--nebula-text-muted);
            padding: 1rem 0;
            text-align: center;
            margin-top: auto;
            font-size: 0.85rem;
            z-index: 1;
        }
    </style>
</head>
<body class="nebula-bg-deep">
    <div class="nebula-neural-grid"></div>
    <nav class="navbar navbar-expand-lg sticky-top nebula-motion-header">
        <div class="container-fluid">
            <a class="navbar-brand" href="login.html"><span class="nebula-brand-text">QuestAI</span></a>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <a class="nav-link" href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <main class="login-main nebula-motion-page">
        <div class="login-container">
            <div class="card login-card nebula-glass-card nebula-motion-card">
                <div class="card-header">
                    <h1>QuestAI</h1>
                    <h2>Sign in to continue</h2>
                </div>
                <div class="card-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn nebula-btn--primary">Login</button>
                        </div>
                    </form>
                    <div id="error-message" class="alert alert-danger mt-3" style="display: none;" role="alert"></div>
                    <div class="text-center mt-3">
                        <a class="login-register-link" href="register.html">Register Now</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2025 QuestAI. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const errorMessageDiv = document.getElementById('error-message');
            errorMessageDiv.style.display = 'none';

            const formData = new FormData(this);
            // Diagnostics: log payload keys (not password value)
            try {
                const debugPayload = Object.fromEntries(formData);
                if (debugPayload && debugPayload.password) debugPayload.password = '***';
                console.log('Login submit payload (debug):', debugPayload);
            } catch (e) {
                console.warn('Could not log payload for debug:', e);
            }

            const searchParams = new URLSearchParams();
            for (const pair of formData) {
                searchParams.append(pair[0], pair[1]);
            }

            try {
                console.log('Posting to', `${backendBaseUrl}/token`);
                const response = await fetch(`${backendBaseUrl}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: searchParams.toString(),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Login failed');
                }
                console.log('Response OK, attempting to parse JSON...');
                const data = await response.json();
                console.log('DEBUG: Backend login response data:', data); // ADDED DEBUG LOG
                localStorage.setItem('access_token', data.access_token);
                console.log('DEBUG: access_token stored:', localStorage.getItem('access_token'));
                localStorage.setItem('username', formData.get('username')); // Store username
                localStorage.setItem('isAdmin', data.is_admin); // Store isAdmin flag
                console.log('is_super_admin from backend:', data.is_super_admin);
            localStorage.setItem('isSuperAdmin', data.is_super_admin === 1 ? 'true' : 'false'); // Store isSuperAdmin flag as boolean string
                localStorage.setItem('expiresIn', data.expires_in); // Store token expiration time

                // Clear the session flag for question generation on new login
                sessionStorage.removeItem('questionsGeneratedThisSession');

                console.log('Login successful, redirecting...');
                if (data.is_admin === 1 || data.is_super_admin === 1) {
                    window.location.href = 'home.html';
                } else {
                    window.location.href = 'home.html';
                }

            } catch (error) {
                errorMessageDiv.textContent = error.message;
                errorMessageDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
