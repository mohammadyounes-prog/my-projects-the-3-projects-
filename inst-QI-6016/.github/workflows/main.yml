name: CI/CD Pipeline

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x' # Use the appropriate Python version

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r new-q-bank/backend/requirements.txt

    - name: Run backend tests
      run: | 
        # Assuming pytest is installed via requirements.txt or globally available
        # If not, add 'pip install pytest' to the previous step
        pytest new-q-bank/tests/test_backend.py

    - name: Frontend check (static files)
      run: |
        echo "Frontend is composed of static HTML/JS/CSS. No build step required."
        echo "Basic file presence check:"
        ls new-q-bank/frontend/
        # Add more comprehensive checks if needed, e.g., linting for JS/CSS
